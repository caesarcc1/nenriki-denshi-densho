<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nenriki Denshi Densho (念力 電子伝書) — Bujinkan Nenriki Dojo</title>
  <meta name="description" content="Sistema Interativo de Estudo do Ten-Chi-Jin Ryaku no Maki e Buki Waza do Bujinkan Nenriki Dojo. Mapa mental, etimologia, mnemônica e biomecânica.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/mindmap.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/kyusho.css">
  <link rel="stylesheet" href="css/flashcards.css">
</head>
<body>

  <!-- CABEÇALHO PRINCIPAL DO SISTEMA -->
  <header class="app-header">
    <div class="header-inner">
      <!-- Identidade e Logo do Dojo -->
      <div class="brand-section">
        <img src="img/nenriki_dojo_logo.png" alt="Bujinkan Nenriki Dojo (武神館 念力道場)" class="brand-logo-img">
        <div class="brand-titles">
          <div class="brand-kanji-title">
            <span class="main-kanji">念力 電子伝書</span>
            <span class="main-romaji">NENRIKI DENSHI DENSHO</span>
          </div>
          <span class="brand-subtitle">Sistema Interativo Ten-Chi-Jin Ryaku no Maki • Bujinkan Nenriki Dojo (武神館 念力道場)</span>
        </div>
      </div>

      <!-- Barra de Busca Global Inteligente -->
      <div class="header-search-box">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="globalSearchInput" class="global-search-input" placeholder="Pesquisar técnica, kanji, etimologia, mnemônica ou arma...">
          <span class="search-shortcut-hint">Ctrl+K</span>
        </div>
      </div>

      <!-- Estatísticas do Densho e Ações de Backup -->
      <div class="header-actions-group">
        <div class="stats-pill" title="Estatísticas da Base de Conhecimento">
          <div class="stat-item">
            <span>Técnicas:</span>
            <span class="stat-num" id="statTotalTechs">0</span>
          </div>
          <span class="stat-sep">•</span>
          <div class="stat-item">
            <span>Kyūsho:</span>
            <span class="stat-num" id="statTotalKyusho">60</span>
          </div>
          <span class="stat-sep">•</span>
          <div class="stat-item">
            <span>Treinadas:</span>
            <span class="stat-num" id="statTrainedCount">0</span>
          </div>
          <span class="stat-sep">•</span>
          <div class="stat-item">
            <span>Editadas:</span>
            <span class="stat-num" id="statCustomCount">0</span>
          </div>
        </div>

        <div class="backup-actions">
          <button class="btn-header-icon" id="btnExportData" title="Exportar Backup do Densho (JSON)">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Exportar
          </button>
          <button class="btn-header-icon" id="btnImportData" title="Importar Backup (JSON)">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            Importar
          </button>
          <input type="file" id="importFileInput" accept=".json" class="hidden">
          <button class="btn-header-icon" id="btnResetAllData" title="Restaurar Padrão Original">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- BARRA DE NAVEGAÇÃO DE VISUALIZAÇÕES -->
  <nav class="nav-tabs-wrapper">
    <div class="nav-tabs-inner">
      <div class="view-tabs-list">
        <button class="nav-tab-btn active" data-view="viewMindmap" id="tabNavMindmap">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          Mapa Mental
        </button>
        <button class="nav-tab-btn" data-view="viewTree" id="tabNavTree">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          Árvore do Densho
        </button>
        <button class="nav-tab-btn" data-view="viewGrid" id="tabNavGrid">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 11h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1zm10 0h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1zM4 21h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1zm10 0h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1z"/></svg>
          Grade de Técnicas
        </button>
        <button class="nav-tab-btn" data-view="viewKyusho" id="tabNavKyusho">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Mapa de Kyūsho (60)
        </button>
        <button class="nav-tab-btn" data-view="viewFlashcards" id="tabNavFlashcards">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
          Dojo Flashcards (Treino)
        </button>
      </div>

      <!-- Filtros Rápidos por Maki & Treino -->
      <div class="maki-pills-filter">
        <span class="maki-filter-pill active" data-maki="all">Todos os Makis</span>
        <span class="maki-filter-pill" data-maki="ten" style="--c:#38bdf8">Ten (Céu)</span>
        <span class="maki-filter-pill" data-maki="chi" style="--c:#4ade80">Chi (Terra)</span>
        <span class="maki-filter-pill" data-maki="jin" style="--c:#fb923c">Jin (Homem)</span>
        <span class="maki-filter-pill" data-maki="buki" style="--c:#eab308">Buki (Armas)</span>
        <span class="maki-filter-pill pill-trained" data-maki="trained">🥋 Treinadas no Dojo</span>
      </div>
    </div>
  </nav>

  <!-- SEÇÕES DE VISUALIZAÇÃO -->
  <main class="main-viewport">
    <!-- 1. Visualização em Grafo / Mapa Mental Interativo -->
    <section class="view-section" id="viewMindmap">
      <div class="mindmap-viewport-wrapper" id="mindmapContainer"></div>
    </section>

    <!-- 2. Visualização em Árvore Estruturada -->
    <section class="view-section hidden" id="viewTree">
      <div class="tree-view-content" id="treeContainer"></div>
    </section>

    <!-- 3. Visualização em Grade de Cartões -->
    <section class="view-section hidden" id="viewGrid">
      <div class="grid-view-content">
        <div class="grid-header-info">
          <span id="searchResultCount" class="badge-custom hidden"></span>
        </div>
        <div class="tech-cards-grid" id="gridContainer"></div>
      </div>
    </section>

    <!-- 4. Visualização do Mapa Anatômico de Kyūsho -->
    <section class="view-section hidden" id="viewKyusho">
      <div class="kyusho-view-wrapper" id="kyushoContainer"></div>
    </section>

    <!-- 5. Visualização em Flashcards de Treino -->
    <section class="view-section hidden" id="viewFlashcards">
      <div class="flashcards-view-wrapper" id="flashcardsContainer"></div>
    </section>
  </main>

  <!-- SCRIPTS DO SISTEMA (Ordem Rigorosa de Inicialização) -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mindmap.js"></script>
  <script src="js/kyusho.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
